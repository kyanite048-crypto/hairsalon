services:
  app:
    image: webdevops/php-apache:8.4
    container_name: salonjc-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    environment:
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=salonjc
      - DB_USERNAME=salonjc
      - DB_PASSWORD=salonjc
      - LOG_CHANNEL=stderr
    command: >
      sh -c "composer install --no-interaction --ignore-platform-reqs &&
             php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: salonjc-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=salonjc
      - MYSQL_USER=salonjc
      - MYSQL_PASSWORD=salonjc
    volumes:
      - salonjc_mysql:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  salonjc_mysql:
